<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VideoMeet — Videobellen</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d32;--panel2:#202b45;--text:#f4f6ff;--muted:#aab5ce;--accent:#7c6cff;--danger:#f05d6c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1b2550 0%,var(--bg) 55%);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:20px clamp(16px,4vw,48px);border-bottom:1px solid #ffffff14}
.logo{font-size:22px;font-weight:800;letter-spacing:-.7px}.logo span{color:#9a8fff}.status{font-size:13px;color:var(--muted)}
main{width:min(1100px,94vw);margin:35px auto}.intro{text-align:center;margin-bottom:26px}.intro h1{font-size:clamp(28px,5vw,44px);margin:0 0 8px;letter-spacing:-1.5px}.intro p{margin:0;color:var(--muted)}
.panel{background:#121a2cdd;border:1px solid #ffffff17;border-radius:22px;padding:20px;box-shadow:0 18px 60px #0003}
.join{display:flex;gap:10px;max-width:620px;margin:0 auto 24px}.join input{min-width:0;flex:1;background:#0d1425;border:1px solid #34405e;border-radius:12px;color:white;padding:14px 15px;font-size:16px;outline:none}.join input:focus{border-color:var(--accent)}
button{border:0;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:750;cursor:pointer;background:var(--accent);color:white;transition:transform .15s,filter .15s}button:hover{filter:brightness(1.12)}button:active{transform:scale(.98)}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#2a3653}.danger{background:var(--danger)}.hidden{display:none!important}
#message{min-height:22px;text-align:center;color:#ffb8c0;font-size:14px;margin:-12px 0 15px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{position:relative;aspect-ratio:4/3;overflow:hidden;background:#202a42;border:1px solid #ffffff17;border-radius:16px;display:flex;align-items:center;justify-content:center;min-width:0}
.tile video{width:100%;height:100%;object-fit:cover;background:#111}.tile .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--muted);pointer-events:none}.avatar{height:48px;width:48px;border-radius:50%;display:grid;place-items:center;background:#6457c8;color:white;font-weight:800;font-size:19px}.name{position:absolute;bottom:9px;left:9px;background:#050914b8;padding:5px 9px;border-radius:8px;font-size:12px;max-width:85%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:15px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:460px){.join{flex-direction:column}.panel{padding:12px}.controls button{flex:1}.grid{gap:8px}}
</style>
</head>
<body>
<header><div class="logo">Video<span>Meet</span></div><div class="status" id="status">Klaar om te starten</div></header>
<main>
<section class="intro"><h1>Praat face-to-face.</h1><p>Maak een kamer aan of deel een kamercode. Tot 8 deelnemers.</p></section>
<section class="panel">
<div class="join" id="joinForm"><input id="roomInput" maxlength="24" placeholder="Kamercode, bijvoorbeeld VRIENDEN12" autocomplete="off"><button id="joinBtn">Start videogesprek</button><button id="randomBtn" class="secondary">🎲 Random chat</button></div>
<div id="message"></div>
<div id="callArea" class="hidden">
<div class="grid" id="videos">
<div class="tile" id="localTile"><video id="localVideo" autoplay playsinline muted></video><div class="placeholder" id="localPlaceholder"><div class="avatar">J</div><span>Jij</span></div><div class="name">Jij (camera)</div></div>
</div>
<div class="controls"><button class="secondary" id="micBtn">🎙️ Microfoon uit</button><button class="secondary" id="cameraBtn">📷 Camera uit</button><button class="secondary" id="copyBtn">Kopieer kamercode</button><button class="secondary hidden" id="nextRandomBtn">⏭️ Volgende persoon</button><button class="danger" id="leaveBtn">Gesprek verlaten</button></div>
<div class="hint">Deel de kamercode met anderen. Geef je browser toestemming voor camera en microfoon.</div>
</div>
</section>
</main>
<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const socket = io();
  const $ = (id) => document.getElementById(id);
  const joinForm = $("joinForm"), joinBtn = $("joinBtn"), roomInput = $("roomInput");
  const callArea = $("callArea"), message = $("message"), status = $("status");
  const localVideo = $("localVideo"), localPlaceholder = $("localPlaceholder"), videos = $("videos");
  let localStream = null, roomCode = "", micOn = true, cameraOn = true, randomMode = false;
  const peers = new Map();
  const pcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun1.l.google.com:19302" }] };

  function say(text) { message.textContent = text || ""; }
  function makeTile(id) {
    let tile = document.getElementById("tile-" + id);
    if (tile) return tile;
    tile = document.createElement("div"); tile.className = "tile"; tile.id = "tile-" + id;
    const video = document.createElement("video"); video.autoplay = true; video.playsInline = true; video.id = "video-" + id;
    const placeholder = document.createElement("div"); placeholder.className = "placeholder"; placeholder.id = "placeholder-" + id;
    const avatar = document.createElement("div"); avatar.className = "avatar"; avatar.textContent = "V";
    const label = document.createElement("span"); label.textContent = "Deelnemer";
    placeholder.append(avatar, label);
    const name = document.createElement("div"); name.className = "name"; name.textContent = "Deelnemer";
    tile.append(video, placeholder, name); videos.appendChild(tile); return tile;
  }
  function removePeer(id) {
    const pc = peers.get(id); if (pc) { pc.close(); peers.delete(id); }
    const tile = document.getElementById("tile-" + id); if (tile) tile.remove();
  }
  function newPeer(id, offerer) {
    if (peers.has(id)) return peers.get(id);
    const pc = new RTCPeerConnection(pcConfig); peers.set(id, pc);
    if (localStream) localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
    pc.onicecandidate = event => { if (event.candidate) socket.emit("signal", {to:id, data:{candidate:event.candidate}}); };
    pc.ontrack = event => {
      makeTile(id);
      const video = $("video-" + id);
      if (video && event.streams[0]) { video.srcObject = event.streams[0]; $("placeholder-" + id).classList.add("hidden"); }
    };
    pc.onconnectionstatechange = () => { if (pc.connectionState === "failed" || pc.connectionState === "closed") removePeer(id); };
    if (offerer) pc.createOffer().then(offer => pc.setLocalDescription(offer)).then(() => socket.emit("signal", {to:id,data:{description:pc.localDescription}})).catch(console.error);
    return pc;
  }
  async function ensureMedia() {
    if (localStream) return true;
    try {
      localStream = await navigator.mediaDevices.getUserMedia({video:true,audio:true});
      localVideo.srcObject = localStream; localPlaceholder.classList.add("hidden");
      return true;
    } catch (err) {
      say("Geen toegang tot camera/microfoon. Geef toestemming in je browser en probeer opnieuw.");
      status.textContent = "Toestemming nodig";
      return false;
    }
  }
  async function startRandom() {
    say("Gebruik random chat alleen als je je daar prettig bij voelt. Deel geen persoonlijke gegevens.");
    joinBtn.disabled = true; $("randomBtn").disabled = true;
    status.textContent = "Camera starten…";
    if (!await ensureMedia()) { joinBtn.disabled = false; $("randomBtn").disabled = false; return; }
    randomMode = true;
    $("nextRandomBtn").classList.remove("hidden");
    joinForm.classList.add("hidden"); callArea.classList.remove("hidden");
    status.textContent = "Zoeken naar iemand…";
    socket.emit("random-next");
  }
  function nextRandom() {
    for (const id of [...peers.keys()]) removePeer(id);
    roomCode = "";
    status.textContent = "Zoeken naar iemand nieuw…";
    say("Even zoeken naar de volgende persoon…");
    socket.emit("random-next");
  }
  async function join() {
    say("");
    const requestedRoom = roomInput.value.trim().toUpperCase();
    if (!requestedRoom) { say("Vul eerst een kamercode in."); return; }
    joinBtn.disabled = true; status.textContent = "Camera starten…";
    if (!await ensureMedia()) { joinBtn.disabled = false; return; }
    socket.emit("join-room", requestedRoom, async result => {
      if (!result || !result.ok) {
        say((result && result.error) || "De kamer kon niet worden geopend.");
        localStream.getTracks().forEach(t=>t.stop()); localStream=null; localVideo.srcObject=null;
        localPlaceholder.classList.remove("hidden"); joinBtn.disabled=false; status.textContent="Klaar om te starten"; return;
      }
      roomCode = result.room; roomInput.value = roomCode;
      joinForm.classList.add("hidden"); callArea.classList.remove("hidden");
      status.textContent = "Kamer " + roomCode + " · " + (result.peers.length + 1) + "/8 deelnemers";
      result.peers.forEach(id => newPeer(id, true));
    });
  }
  function leave() {
    socket.emit("leave-room");
    for (const id of [...peers.keys()]) removePeer(id);
    if (localStream) { localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
    localVideo.srcObject=null; localPlaceholder.classList.remove("hidden");
    callArea.classList.add("hidden"); joinForm.classList.remove("hidden");
    $("nextRandomBtn").classList.add("hidden"); $("randomBtn").disabled=false; randomMode=false;
    joinBtn.disabled=false; status.textContent="Klaar om te starten"; roomCode=""; say("");
  }
  joinBtn.addEventListener("click", join);
  $("randomBtn").addEventListener("click", startRandom);
  $("nextRandomBtn").addEventListener("click", nextRandom);
  roomInput.addEventListener("keydown", e => { if (e.key === "Enter") join(); });
  $("micBtn").addEventListener("click", () => {
    if (!localStream) return; micOn=!micOn; localStream.getAudioTracks().forEach(t=>t.enabled=micOn);
    $("micBtn").textContent = micOn ? "🎙️ Microfoon uit" : "🔇 Microfoon aan";
  });
  $("cameraBtn").addEventListener("click", () => {
    if (!localStream) return; cameraOn=!cameraOn; localStream.getVideoTracks().forEach(t=>t.enabled=cameraOn);
    $("cameraBtn").textContent = cameraOn ? "📷 Camera uit" : "📷 Camera aan";
    localPlaceholder.classList.toggle("hidden", cameraOn);
  });
  $("copyBtn").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(roomCode); $("copyBtn").textContent="Gekopieerd!"; setTimeout(()=> $("copyBtn").textContent="Kopieer kamercode",1600); }
    catch { say("Kamercode: " + roomCode); }
  });
  $("leaveBtn").addEventListener("click", leave);
  socket.on("random-waiting", () => { status.textContent = "Zoeken naar iemand…"; say("Je staat in de wachtrij. We verbinden je zodra iemand beschikbaar is."); });
  socket.on("random-matched", ({room, peer, offerer}) => {
    roomCode = room;
    status.textContent = "Random videochat · verbonden";
    say("Je bent verbonden met iemand nieuw. Deel geen persoonlijke gegevens.");
    newPeer(peer, offerer);
  });
  socket.on("random-cancelled", () => { status.textContent = "Zoeken gestopt"; });
  socket.on("peer-joined", ({id}) => { status.textContent = "Kamer " + roomCode + " · " + (peers.size + 2) + "/8 deelnemers"; say("Er neemt iemand deel aan de kamer."); });
  socket.on("peer-left", id => {
    removePeer(id);
    if (randomMode) { status.textContent = "De ander heeft de chat verlaten"; say("Klik op ‘Volgende persoon’ om opnieuw te zoeken."); }
    else status.textContent = "Kamer " + roomCode + " · " + (peers.size + 1) + "/8 deelnemers";
  });
  socket.on("signal", async ({from, data}) => {
    try {
      const pc = newPeer(from, false);
      if (data.description) {
        await pc.setRemoteDescription(data.description);
        if (data.description.type === "offer") {
          const answer = await pc.createAnswer(); await pc.setLocalDescription(answer);
          socket.emit("signal", {to:from,data:{description:pc.localDescription}});
        }
      } else if (data.candidate) await pc.addIceCandidate(data.candidate);
    } catch (err) { console.error("Signaling error", err); }
  });
  socket.on("disconnect", () => { status.textContent = "Verbinding verbroken"; say("Verbinding met de server verbroken. Vernieuw de pagina als dit blijft."); });
})();
</script>
</body>
</html>
